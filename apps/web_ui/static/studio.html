<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allen Knows Ball — Studio (Polotno)</title>
  <link href="https://unpkg.com/polotno@4/ui.css" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0d10; color: #f5f1e6;
      font: 14px/1.5 Arial, sans-serif; }
    #topbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
      background: #14171c; border-bottom: 1px solid #2a2f36; flex-wrap: wrap; }
    #topbar .brand { font-weight: 700; letter-spacing: 1px; margin-right: 8px; }
    #topbar .brand span { color: #c8102e; }
    #topbar label { color: #9aa3a8; font-size: 12px; }
    #topbar select, #topbar input { background: #0b0d10; color: #f5f1e6;
      border: 1px solid #2a2f36; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
    #topbar button { background: #c8102e; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 12px; font-size: 13px; cursor: pointer; }
    #topbar button.secondary { background: #2a2f36; }
    #topbar button:disabled { opacity: .45; cursor: default; }
    #status { color: #9aa3a8; font-size: 12px; }
    #status.ok { color: #8cff00; }
    #status.err { color: #ff6b6b; }
    #keywarn { display: none; width: 100%; background: #3a2a00; color: #ffd75e;
      font-size: 12px; padding: 6px 12px; }
    #offline { display: none; width: 100%; background: #3a0000; color: #ff9d9d;
      font-size: 13px; padding: 10px 12px; }
    #container { width: 100vw; height: calc(100vh - 52px); }
  </style>
</head>
